name: Code Formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-formatting:
    name: Python Formatting (Black)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python formatting with Black
        uses: psf/black-action@v24.8.0
        with:
          options: "--check --exclude '/(build|3rdParty)/'"
          src: "."

  cpp-formatting:
    name: C/C++ Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check C/C++ formatting with clang-format
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '19'
          check-path: '.'
          exclude-regex: '(build|3rdParty)'