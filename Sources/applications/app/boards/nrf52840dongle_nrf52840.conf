# This the BLE configuration for logger driver and dfu module it propose our peripheral device data exchagne parameters values to the ble central 
# while negotiating parameteres (between central and peripheral)

CONFIG_BT_USER_DATA_LEN_UPDATE=y

CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=498
CONFIG_BT_BUF_ACL_TX_SIZE=498
CONFIG_BT_L2CAP_TX_MTU=502

# Disable dongle mbr bootloader
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
