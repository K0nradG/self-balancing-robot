CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Enable battery controller and logs:
CONFIG_BATTERY_LEVEL_DRV=y
CONFIG_BATTERY_LEVEL_LOG=n

# Enable motor controller and logs:
CONFIG_MOTOR_CONTROLLER_DRV=y
CONFIG_MOTOR_CONTROLLER_LOG=n

# Enable interface controller and logs:
CONFIG_INTERFACE_DRV=y
CONFIG_INTERFACE_LOG=n

# Enable IMU driver, logs and IMU calibration:
CONFIG_IMU_DRV=y
CONFIG_IMU_LOG=n
CONFIG_IMU_CALIBRATE_GYRO=n

# Enable robot control loop, angle validation and logs:
CONFIG_ROBOT_CONTROL=y
CONFIG_ROBOT_CONTROL_LOG=y
CONFIG_VALIDATE_ROBOT_ANGLE=y

# Balance controller selection: PID - y, LQR - n:
CONFIG_PID_ENABLED=y

# Enable model identification driver and logs:
CONFIG_MODEL_IDENTIFICATION_DRV=n
CONFIG_MODEL_IDENTIFICATION_LOG=n

# Enable logs from utils module:
CONFIG_UTILS_LOG=n

# Enable logger drivers:
CONFIG_LOGGER_DRV=y
CONFIG_LOG_OVER_SERIAL=y

# Enable bluetooth driver:
CONFIG_BLUETOOTH_DRV=y

CONFIG_BT_DEVICE_NAME="SELF_BALANCING_ROBOT"

# Enable encoder driver and logs:
CONFIG_ENCODER_DRV=y
CONFIG_ENCODER_LOG=n

# Enable app log:
CONFIG_APP_LOG=y

# Enable debug:
CONFIG_APP_DEBUG=y

# Enable FPU module for proper floats handling:
CONFIG_FPU=y

# ±4g for accelerometer:
CONFIG_MPU6050_ACCEL_FS=2

# ±500°/s for gyro: 
CONFIG_MPU6050_GYRO_FS=250

# Enable possibility for reboot when drivers initialization fails:
CONFIG_REBOOT=y

# Enable watchdog controller driver and logs:
CONFIG_WATCHDOG_CONTROLLER_DRV=n
CONFIG_WATCHDOG_CONTROLLER_DRV_LOG=n

# Enable DFU BLE SMP module:
CONFIG_DFU_BLE=y

# Enable UART driver
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y

# Enable logging over UART
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_USB_DEVICE_STACK=n

# Increase stack sizes to handle UART and BLE stacks:
CONFIG_MAIN_STACK_SIZE=16392
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16392
CONFIG_BT_RX_STACK_SIZE=16392
CONFIG_BT_HCI_TX_STACK_SIZE=16392
CONFIG_UART_ASYNC_API=n
CONFIG_UART_INTERRUPT_DRIVEN=n

CONFIG_PINCTRL=y

CONFIG_UART_NRFX=y
