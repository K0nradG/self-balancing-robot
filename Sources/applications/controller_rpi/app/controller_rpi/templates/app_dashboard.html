<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Application Dashboard</title>
  <script src="/static/tailwind.js"></script>
  <style>
    body {
      background: linear-gradient(120deg, #60a5fa, #a78bfa, #f472b6);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    a.btn {
      text-decoration: none;
      display: inline-block;
      font-size: 1.1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      margin: 0.25rem;
      cursor: pointer;
      text-align: center;
    }

    a.btn-primary {
      background-color: #4f46e5;
      color: white;
    }

    a.btn-primary:hover {
      background-color: #4338ca;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #4f46e5;
    }

    .btn {
      font-size: 1.1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      margin: 0.25rem;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .btn-secondary {
      background-color: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .btn-success {
      background-color: #16a34a;
      color: white;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    pre {
      background: #111;
      color: #4ade80;
      padding: 10px;
      border-radius: 10px;
      height: 220px;
      overflow-y: auto;
      text-align: left;
    }

    #status {
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    #robotControllerBtn {
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Application Dashboard</h1>

    <div id="status">Connection: disconnected | Application: wait for DFU</div>

    <div class="flex flex-wrap justify-center mb-4">
      <button id="connectBtn" class="btn btn-primary">CONNECT</button>
      <button id="disconnectBtn" class="btn btn-secondary" style="display:none;">DISCONNECT</button>
      <button id="startAppBtn" class="btn btn-success" style="display:none;">START APPLICATION</button>
      <button id="showLogsBtn" class="btn btn-primary" style="display:none;">SHOW DEVICE LOGS</button>
      <button id="hideLogsBtn" class="btn btn-secondary" style="display:none;">HIDE DEVICE LOGS</button>
      <a id="robotControllerBtn" href="/motion" class="btn btn-primary">Robot Controller</a>
    </div>

    <pre id="logBox"></pre>
  </div>

  <script>
    const addr = "E6:AD:30:2D:3A:6B";
    const logBox = document.getElementById('logBox');
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const startAppBtn = document.getElementById('startAppBtn');
    const showLogsBtn = document.getElementById('showLogsBtn');
    const hideLogsBtn = document.getElementById('hideLogsBtn');
    const robotControllerBtn = document.getElementById('robotControllerBtn');

    let connectionStatus = "disconnected";
    let applicationStatus = "wait for DFU";

    // --- LOCAL STORAGE ---
    function saveState() {
      localStorage.setItem('connectionStatus', connectionStatus);
      localStorage.setItem('applicationStatus', applicationStatus);
    }

    function loadState() {
      connectionStatus = localStorage.getItem('connectionStatus') || "disconnected";
      applicationStatus = localStorage.getItem('applicationStatus') || "wait for DFU";
      updateUI();
    }

    async function fetchNUSLogs() {
      try {
        const res = await fetch('/nus/logs');
        const data = await res.json();
        if (Array.isArray(data.logs)) {
          logBox.textContent = data.logs.join('\n');
          logBox.scrollTop = logBox.scrollHeight;
        }
      } catch (err) {
        console.warn('Błąd logów NUS:', err);
      }
    }

    setInterval(() => {
      if (hideLogsBtn.style.display === "inline-block") {
        fetchNUSLogs();
      }
    }, 1000);


    // --- POST HELP ---
    async function post(path, data = {}) {
      const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      return await res.json();
    }

    // --- UPDATE UI ---
    function updateUI() {
      // connect/disconnect buttons
      connectBtn.style.display = (connectionStatus === "disconnected") ? "inline-block" : "none";
      disconnectBtn.style.display = (connectionStatus === "connected") ? "inline-block" : "none";

      // start application & show logs visible only if connected
      startAppBtn.style.display = (connectionStatus === "connected") ? "inline-block" : "none";
      showLogsBtn.style.display = (connectionStatus === "connected" && hideLogsBtn.style.display === "none") ? "inline-block" : "none";

      // hide logs button
      hideLogsBtn.style.display = hideLogsBtn.style.display;

      // robot controller only if connected AND application work
      robotControllerBtn.style.display = (connectionStatus === "connected" && applicationStatus === "application work") ? "inline-block" : "none";

      // status text
      statusEl.textContent = `Connection: ${connectionStatus} | Application: ${applicationStatus}`;
    }

    async function setConnectionStatus(status) {
      connectionStatus = status;
      updateUI();
      saveState();
    }

    async function setApplicationStatus(status) {
      applicationStatus = status;
      updateUI();
      saveState();
    }

    // --- BUTTON EVENTS ---
    connectBtn.onclick = async () => {
      await setConnectionStatus("connecting");
      await post('/nus/connect', { address: addr });
      // symulacja połączenia
      setTimeout(() => setConnectionStatus("connected"), 1000);
    };

    disconnectBtn.onclick = async () => {
      await post('/nus/disconnect');
      setConnectionStatus("disconnected");
      setApplicationStatus("wait for DFU");
    };

    startAppBtn.onclick = async () => {
      await post('/nus/send', { data: 'ds' });
      setApplicationStatus("application work");
    };

    showLogsBtn.onclick = async () => {
      await post('/nus/notify_on');
      showLogsBtn.style.display = "none";
      hideLogsBtn.style.display = "inline-block";
    };

    hideLogsBtn.onclick = async () => {
      await post('/nus/notify_off');
      hideLogsBtn.style.display = "none";
      showLogsBtn.style.display = "inline-block";
    };

    // --- INIT ---
    loadState();
  </script>
</body>

</html>
