<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Robot Controller</title>
  <script src="/static/tailwind.js"></script>
  <style>
    body {
      background: linear-gradient(120deg, #60a5fa, #a78bfa, #f472b6);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 1000;
    }

    #controls .btn {
      padding: 1rem 2rem;
      font-size: 1.3rem;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #4f46e5;
    }

    .btn {
      font-size: 1.1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      margin: 0.25rem;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background-color: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .btn-secondary {
      background-color: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .status {
      font-size: 1.5rem;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Robot Controller</h1>
    <p>Hold the phone horizontally and tilt left/right</p>

    <div class="mb-4">
      <img id="cameraStream" src="" alt="Camera stream" style="max-width:100%; border-radius:10px; display:none;">
    </div>

    <div class="flex justify-center flex-wrap mb-4">
      <button id="camStart" class="btn btn-primary">START CAMERA</button>
      <button id="camStop" class="btn btn-secondary" style="display:none;">STOP CAMERA</button>
    </div>

    <div class="flex justify-center flex-wrap mb-4">
      <button id="startBtn" class="btn btn-primary">START CONTROL</button>
      <button id="stopBtn" class="btn btn-secondary" style="display:none;">STOP CONTROL</button>
      <a href="/app" class="btn btn-success">BACK</a>
    </div>

    <p>Rotate: <span id="rotate">0</span>°</p>
    <p>Distance: <span id="distance">0</span> m</p>

    <div id="controls">
      <button id="forward" class="btn btn-primary">Forward</button>
      <button id="backward" class="btn btn-secondary">Backward</button>
    </div>
  </div>

  <script>
    let rotate = 0, distance = 0;
    let forwardPressed = false, backwardPressed = false;
    const ROTATE_MAX = 200, DIST_STEP = 2;
    const SAMPLE_MS = 500;

    const rotateEl = document.getElementById('rotate');
    const distanceEl = document.getElementById('distance');

    const camStart = document.getElementById('camStart');
    const camStop = document.getElementById('camStop');
    const camStream = document.getElementById('cameraStream');

    let controlActive = false;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    // accelerometer data
    let latestMotion = null;

    startBtn.onclick = () => {
      controlActive = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      mainLoop();
    };

    stopBtn.onclick = () => {
      controlActive = false;
      stopBtn.style.display = 'none';
      startBtn.style.display = 'inline-block';
    };

    camStart.onclick = async () => {
      await fetch('/camera/start', { method: 'POST' });
      camStream.src = '/camera/stream';
      camStream.style.display = 'block';
      camStart.style.display = 'none';
      camStop.style.display = 'inline-block';
    };

    camStop.onclick = async () => {
      await fetch('/camera/stop', { method: 'POST' });
      camStream.src = '';
      camStream.style.display = 'none';
      camStop.style.display = 'none';
      camStart.style.display = 'inline-block';
    };

    function handleNUSLogLine(line) {
      if (line.includes("tc")) {
        if (!waitingAck) return;
        waitingAck = false;
      }
    }

    document.getElementById('forward').addEventListener('mousedown', () => forwardPressed = true);
    document.getElementById('forward').addEventListener('mouseup', () => forwardPressed = false);
    document.getElementById('backward').addEventListener('mousedown', () => backwardPressed = true);
    document.getElementById('backward').addEventListener('mouseup', () => backwardPressed = false);

    // touch support
    document.getElementById('forward').addEventListener('touchstart', e => { e.preventDefault(); forwardPressed = true; });
    document.getElementById('forward').addEventListener('touchend', e => { e.preventDefault(); forwardPressed = false; });
    document.getElementById('backward').addEventListener('touchstart', e => { e.preventDefault(); backwardPressed = true; });
    document.getElementById('backward').addEventListener('touchend', e => { e.preventDefault(); backwardPressed = false; });


    window.addEventListener('devicemotion', (event) => {
      const a = event.accelerationIncludingGravity;
      if (!a) return;
      latestMotion = a;
    });

    // for chrome searcher we need to manulay approve access to montion sensors
    // DeviceMotionEvent.requestPermission()

    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(res => {
        if (res !== 'granted') alert('Brak zgody na czujniki ruchu');
      });
    }

    async function mainLoop() {
      while (controlActive) {
        const tilt = latestMotion?.y ?? 0;

        const GRAVITY = 9.81;
        rotate = Math.max(-ROTATE_MAX, Math.min(ROTATE_MAX, (tilt / GRAVITY) * ROTATE_MAX));
        distance = forwardPressed ? DIST_STEP : backwardPressed ? -DIST_STEP : 0;

        rotateEl.textContent = rotate.toFixed(1);
        distanceEl.textContent = distance;

        const payload = `tr${rotate.toFixed(1)}d${distance.toFixed(1)}`;
        console.log("Sending:", payload);

        try {
          await fetch('/nus/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: payload })
          });
        } catch (e) {
          console.warn('Send error:', e);
          await new Promise(r => setTimeout(r, 500));
          continue;
        }

        // --- wait for trajecoty_ack from NUS
        let ackData = { ack: false };
        try {
          const ackRes = await fetch('/nus/wait_ack');
          ackData = await ackRes.json();
        } catch (e) {
          console.warn("Trajectory ack wait error:", e);
        }

        if (ackData.ack) {
          console.log("Trajectory ack received");
        } else {
          console.warn("Trajectory ack timeout");
        }

        await new Promise(r => setTimeout(r, SAMPLE_MS));
      }
      console.log("Control loop stopped");
    }

  </script>
</body>

</html>
